<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Rummi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Familjen+Grotesk:wght@400;600;700&display=swap">
<script src="https://unpkg.com/nostr-tools@2.7.2/lib/nostr.bundle.js"></script>
<style>
:root{
  /* Layout: a felt card table fills the screen; combinations wrap across the felt; a walnut rack docks at the bottom */
  --felt:#15463d; --felt-2:#0d302a; --wood:#5e3b21; --wood-2:#3d2614; --wood-edge:#80552f;
  --ivory:#f8f1df; --ivory-2:#e5dbc0; --tile-edge:#b8a984;
  --ink:#eef5f0; --muted:#a6c3b9; --brass:#f1b53d; --brass-ink:#2b1b04; --ok:#6fdc9a; --bad:#ff8b78;
  --t0:#c92e28; --t1:#1b5db0; --t2:#202124; --t3:#e0790b;
  --display:'Alfa Slab One', Rockwell, 'Roboto Slab', Georgia, serif;
  --ui:'Familjen Grotesk', 'Segoe UI', system-ui, sans-serif;
  --tw:clamp(30px, 7.6vw, 42px);
  --th:calc(var(--tw) * 1.36);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* Game locked sideways: on a phone held upright the whole stage is turned 90 degrees. */
html.rot #stage{width:var(--vh);height:var(--vw);transform:translateX(var(--vw)) rotate(90deg);transform-origin:0 0;padding:0 env(safe-area-inset-bottom,0px) 0 env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 25%, var(--felt), var(--felt-2) 80%) fixed;background-color:var(--felt-2);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.screen{flex:1;overflow:auto;padding:28px 16px 40px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.35rem}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

.tile{width:var(--tw);height:calc(var(--tw) * 1.36);border-radius:6px;border:none;padding:0;flex:none;
  background:linear-gradient(var(--ivory),var(--ivory-2));box-shadow:0 2px 0 var(--tile-edge),0 4px 7px rgba(0,0,0,.35);
  font-family:var(--display);font-size:calc(var(--tw) * .56);line-height:1;display:inline-grid;place-items:center;position:relative;
  cursor:default;transition:transform .12s ease, box-shadow .12s ease;user-select:none;-webkit-user-select:none}
.tile::after{content:"";position:absolute;bottom:13%;left:35%;width:30%;height:3px;border-radius:2px;background:currentColor;opacity:.3}
.tile.c0{color:var(--t0)} .tile.c1{color:var(--t1)} .tile.c2{color:var(--t2)} .tile.c3{color:var(--t3)}
.tile.joker{color:var(--t0)}
.tile.joker::after{display:none}
.tile .jk{width:84%;height:auto;margin-top:6%}
.rack .tile,.live .tile{touch-action:none}
.tile.lifting{opacity:.3}
.ghost{position:fixed;left:0;top:0;z-index:40;display:flex;gap:3px;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));transform:translate(-999px,-999px)}
.ghost .tile{transform:rotate(-3deg) scale(1.08)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.board.live.drophover{border:none!important;background:rgba(241,181,61,.06)!important}
.live .tile{cursor:pointer}
.live .tile:hover{transform:translateY(-2px)}
.tile.sel{transform:translateY(-7px)!important;box-shadow:0 0 0 3px var(--brass),0 8px 14px rgba(0,0,0,.45)}
.tile.fresh::before{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--brass)}
.tile.flash{animation:flash 2.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--ok),0 4px 7px rgba(0,0,0,.35)}100%{box-shadow:0 2px 0 var(--tile-edge),0 4px 7px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.flash{animation:none}}

.btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:.85rem}
input.field{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:11px 12px;color:var(--ink);font:inherit;font-size:1rem}
input.field::placeholder{color:var(--muted);opacity:.7}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-size:1.15rem}
select.field{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.field option{background:var(--felt-2);color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.opt{display:grid;gap:4px;font-size:.85rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.clock.low{color:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.clock.low{animation:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:0}
.panel{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;display:grid;gap:12px}

.logo{display:flex;gap:6px;flex-wrap:wrap}
.logo .tile{--tw:clamp(38px,11vw,54px);cursor:default}
.lead{font-size:1.05rem;color:var(--muted);max-width:44ch}
details.rules{font-size:.92rem}
details.rules summary{cursor:pointer;font-weight:600}
details.rules ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--muted)}
details.rules b{color:var(--ink)}

.bigcode{font-family:var(--display);font-size:clamp(2.4rem,12vw,3.6rem);letter-spacing:.18em;color:var(--brass);line-height:1}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.plist .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat{font-family:var(--display);width:26px;height:26px;border-radius:6px;background:var(--ivory);color:var(--t2);display:grid;place-items:center;font-size:.85rem;flex:none}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--bad)}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px}

.topbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.22);border-bottom:1px solid rgba(255,255,255,.07)}
.room{font-family:var(--display);color:var(--brass);letter-spacing:.12em}
.pool{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px;scrollbar-width:thin}
@media (max-width:560px){.chips{order:5;flex-basis:100%}}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);white-space:nowrap;font-size:.88rem;flex:none}
.chip .cnt{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.25);border-radius:999px;padding:0 7px}
.chip.turn{background:var(--brass);color:var(--brass-ink)}
.chip.turn .cnt{background:rgba(0,0,0,.15)}
.chip.away{opacity:.55}
.chip .m{font-size:.7rem;opacity:.75}
/* Game table, laid out like a card table seen from your seat:
   players down the left, the table in the middle, your wooden rack at the bottom,
   and the action buttons fixed down the right. */
#app.scr-game{display:block}
.game{height:100%;display:grid;grid-template-columns:var(--pw,130px) minmax(0,1fr) var(--bw,80px);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"players info side" "players board side" "players rack side"}
.players{grid-area:players;min-height:0;padding:8px 4px 8px 8px;border-right:1px solid rgba(255,255,255,.06)}
.players ul{list-style:none;margin:0;padding:0;height:100%;display:flex;flex-direction:column;gap:4px}
.pl{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:10px;min-width:0}
.pl.me{margin-top:auto}
.pl.turn{background:rgba(241,181,61,.14)}
.pl.away{opacity:.5}
.av{--p:0;width:var(--av,40px);height:var(--av,40px);border-radius:50%;flex:none;padding:3px;box-sizing:border-box;
  background:conic-gradient(var(--ok) calc(var(--p) * 360deg), rgba(255,255,255,.14) 0)}
.pl:not(.turn) .av{background:rgba(255,255,255,.14)}
.av.low{background:conic-gradient(var(--bad) calc(var(--p) * 360deg), rgba(255,255,255,.14) 0)}
.avt{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);color:#fff;
  font-size:calc(var(--av,40px) * .36);font-variant-numeric:tabular-nums;border:2px solid var(--felt-2);box-sizing:border-box}
.avt.c0{background:var(--t0)} .avt.c1{background:var(--t1)} .avt.c2{background:#4b4d55} .avt.c3{background:var(--t3)}
.pl.turn .avt{font-size:calc(var(--av,40px) * .42)}
.pinfo{display:grid;min-width:0;line-height:1.2}
.pn{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.me .pn{color:var(--brass)}
.pc{display:flex;align-items:center;gap:3px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pc .m{color:var(--ok);margin-left:2px}
.ti{width:.7em;height:.95em;flex:none}
.info{grid-area:info;display:flex;align-items:center;gap:6px 12px;padding:6px 10px;font-size:.82rem;white-space:nowrap;min-width:0;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.05)}
.info .room{font-family:var(--display);color:var(--brass);letter-spacing:.1em}
.info .you{color:var(--brass);font-family:var(--display);font-weight:400;font-size:.95rem}
.info .log{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--muted);text-align:right}
.info .warnmsg{color:var(--bad);font-weight:700}
.info .btn.small{padding:3px 8px;font-size:.78rem}
.board{grid-area:board;overflow:auto;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px 10px;align-content:flex-start;min-height:0}
.set{display:flex;gap:2px;padding:3px;border-radius:8px;background:rgba(0,0,0,.16);border:1.5px solid transparent;align-items:center}
.set.ok{border-color:rgba(111,220,154,.45)}
.set.bad{border-color:var(--bad);background:rgba(255,139,120,.09)}
.newset{min-width:calc(var(--tw) * 3);height:calc(calc(var(--tw) * 1.36) + 8px);border:1.5px dashed rgba(255,255,255,.28);border-radius:8px;display:grid;place-items:center;color:var(--muted);padding:0 10px;font-size:.75rem;text-align:center}
.drophover{border-color:var(--brass)!important;background:rgba(241,181,61,.14)!important}
.board.live.drophover{border:none!important;background:rgba(241,181,61,.05)!important}
.empty{color:var(--muted);align-self:center;max-width:36ch;font-size:.9rem}
.meter{font-variant-numeric:tabular-nums;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.25);font-size:.78rem}
.meter.done{background:var(--ok);color:#06210f}
#timer{font-variant-numeric:tabular-nums}
.rackwrap{grid-area:rack;display:flex;justify-content:center;align-items:flex-end;padding:0 8px;min-width:0}
.rack{--tw:var(--rt,34px);display:grid;grid-template-columns:repeat(var(--cols,13), var(--rt,34px));grid-auto-rows:calc(var(--rt,34px) * 1.36);gap:4px 3px;
  padding:7px 9px 8px;border-radius:10px 10px 0 0;max-width:100%;overflow-x:auto;
  background:linear-gradient(180deg,#b9824c,#8f5c2c 55%,#7a4c22);border:1px solid #c99460;border-bottom:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -6px 10px rgba(0,0,0,.25),0 -6px 16px rgba(0,0,0,.35)}
.rslot{border-radius:5px;background:rgba(0,0,0,.13);display:grid}
.rslot .tile{width:100%;height:100%}
.rslot.drophover{background:rgba(255,236,190,.45)!important}
.watch{padding:10px 0 14px}
.side{grid-area:side;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:8px 8px 10px;min-height:0;border-left:1px solid rgba(255,255,255,.06)}
html:not(.rot) .side{padding-bottom:78px} /* clear of the hosting site's corner badge */
html.rot .side{padding-top:50px}
.sidemid,.sidebot{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.sidetop{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.sidetop .vbtns{justify-content:center;flex-wrap:wrap;gap:2px 6px}
.sidetop .ibtn{width:32px;height:32px}
.sidetop .ibtn svg{width:16px;height:16px}
.sidetop .calltime{font-size:.72rem;text-align:center}
.sbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:12px;padding:6px 4px;color:var(--ink);display:grid;place-items:center;gap:2px;cursor:pointer;font-weight:700;font-size:.72rem;line-height:1.1}
.sbtn:hover:not(:disabled){background:rgba(255,255,255,.15)}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.sbtn svg{width:20px;height:20px}
.sbtn.exit{width:30px;height:30px;padding:0;border-radius:50%;flex:none}
.sbtn.exit svg{width:14px;height:14px}
.sbtn.exit.warn{width:auto;height:30px;padding:0 8px;border-radius:999px;display:flex;gap:4px;font-size:.66rem}
.sbtn.exit.warn{border-color:var(--bad);color:var(--bad)}
.sbtn.sort{font-family:var(--display);font-weight:400;font-size:clamp(.95rem,2.6vh,1.25rem);letter-spacing:.04em;padding:9px 4px;background:rgba(27,93,176,.35);border-color:rgba(120,170,240,.4)}
.sbtn.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
.sbtn.draw{border:2px solid var(--brass);background:rgba(241,181,61,.1);padding:8px 4px}
.sbtn.draw .plus{font-size:2rem;line-height:.9;color:var(--brass);font-weight:400}
.sbtn.draw .cnt{display:flex;align-items:center;gap:3px;font-size:.8rem;font-variant-numeric:tabular-nums}
.tile.last{box-shadow:0 0 0 2px var(--brass),0 2px 0 var(--tile-edge),0 4px 7px rgba(0,0,0,.35)}
.tile.blink{animation:blink .45s ease-in-out 6 alternate}
@keyframes blink{from{box-shadow:0 0 0 2px var(--brass),0 0 12px 3px rgba(241,181,61,.9)}to{box-shadow:0 0 0 2px transparent,0 2px 0 var(--tile-edge)}}
.tile.pending{opacity:.75;outline:2px dashed rgba(255,255,255,.55);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.tile.blink{animation:none}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:20}
.card{background:var(--felt-2);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto}
.results{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.results li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
.results li.win{background:var(--brass);color:var(--brass-ink)}
.results .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbtns{display:flex;gap:6px;align-items:center;flex:none}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;padding:0;flex:none;transition:background .15s,color .15s,border-color .15s}
.ibtn svg{width:19px;height:19px}
.ibtn:hover{background:rgba(255,255,255,.15)}
.ibtn.live{background:var(--ok);border-color:var(--ok);color:#06210f}
.ibtn.ongoing{border-color:var(--ok);color:var(--ok)}
.ibtn .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ivory);color:var(--t2);font-size:.68rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.calltime{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--ok);min-width:3.2ch}
.incoming{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;width:min(420px,calc(100% - 32px));
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:center;padding:14px 16px;border-radius:16px;
  background:var(--felt-2);border:1px solid var(--ok);box-shadow:0 16px 34px rgba(0,0,0,.55);animation:dropin .25s ease-out}
.incoming .ring-ic{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#06210f;display:grid;place-items:center;animation:ringpulse 1.4s ease-in-out infinite}
.incoming .ring-ic svg{width:22px;height:22px}
.incoming .who{display:grid;gap:2px;min-width:0}
.incoming .who strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incoming .who span{color:var(--muted);font-size:.85rem}
.incoming .answer{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.cbtn svg{width:20px;height:20px}
.cbtn.no{background:var(--bad);color:#2a0702}
.cbtn.yes{background:var(--ok);color:#06210f}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 0 rgba(111,220,154,.65)}50%{box-shadow:0 0 0 10px rgba(111,220,154,0)}}
@keyframes dropin{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.incoming,.incoming .ring-ic{animation:none}}
/* Phones held sideways on the start and waiting screens: two columns */
@media (orientation:landscape) and (max-height:520px){
  .screen{padding-block:18px 24px}
  .scr-home .wrap,.scr-lobby .wrap{max-width:920px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}
  .wrap > .logo,.wrap > .lead,.wrap > .banner,.wrap > details,.wrap > .row{grid-column:1 / -1}
  .logo .tile{--tw:clamp(32px,9vh,44px)}
}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ivory);color:var(--t2);padding:10px 16px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:30;max-width:calc(100% - 32px);font-weight:600}
.toast.err{background:var(--bad);color:#2a0702}
</style>
</head>
<body>
<div id="stage">
<div id="app"></div>
<div id="voice"></div>
<div id="toast" class="toast" hidden></div>
</div>
<div id="voice-audio" hidden></div>

<script>
(() => {
const CNAME = ['vermelho', 'azul', 'preto', 'laranja'];
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Seat, room and host state are kept per tab (survive a reload); the nickname is remembered across tabs.

// Best way to lay down tiles from `ids` as separate combinations, within a time budget.
function bestPartition(ids, budgetMs, score) {

let liveBoard = null, lastAt = 0, lastKey = '';
function receiveView(v) {
  G = v; clockOff = (v.now || Date.now()) - Date.now();
  tiles(v.copies || 2);
  st.screen = G.status === 'lobby' ? 'lobby' : 'game';
  const k = (G.lastPlayed || []).join(',') + '@' + (G.lastBy || '');
  if (k !== lastKey) { lastKey = k; lastAt = Date.now(); }
  if (prevRev !== G.rev) { st.confirmSkip = false; liveBoard = null; }
  prevRev = G.rev;
  if (myTurn()) {
    if (!W || W.rev !== G.rev) { W = { rev: G.rev, board: G.board.map(s => [...s]), rack: [...G.myRack] }; sel.clear(); }
  } else { W = null; sel.clear(); }
  if (drag && drag.started) st.dirty = true; else render();
}

// While it is my turn, everyone else sees the table as I rearrange it.
let liveTimer = null;
function pushLive() {
  if (!W || !G || G.solo) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { if (W && myTurn()) netSend({ t: 'live', to: '*', rev: G.rev, board: W.board }); }, 250);
}
function liveMsg(from, m) {
  if (!G || G.status !== 'playing' || myTurn() || from !== G.order[G.turn] || m.rev !== G.rev) return;
  const b = m.board;
  if (!Array.isArray(b) || b.length > 120 || !b.every(s => Array.isArray(s) && s.length <= 13 && s.every(i => Number.isInteger(i) && i >= 0 && i < TT.length))) return;
  const all = b.flat();
  if (new Set(all).size !== all.length) return;
  liveBoard = { rev: m.rev, board: b };
  if (drag && drag.started) st.dirty = true; else render();
}

function meldPoints() {
  if (!W) return 0;
  const mine = new Set(G.myRack);
  return W.board.filter(s => s.every(i => mine.has(i))).map(analyze).filter(a => a.valid).reduce((a, b) => a + b.value, 0);
}

// Dropping a tile into the middle of a run splits it: 1-2-3-4-5-6 plus another 3 becomes 1-2-3 and 3-4-5-6.
function splitRun(set, id) {
  const t = TT[id], a = analyze(set);
  if (t.j || !a.valid || a.kind !== 'run') return null;
  const lay = a.layout, k = lay.findIndex(i => !TT[i].j);
  if (TT[lay[k]].c !== t.c) return null;
  const pos = t.n - (TT[lay[k]].n - k);
  if (pos < 0 || pos >= lay.length) return null;
  for (const [l, r] of [[[...lay.slice(0, pos), id], lay.slice(pos)], [lay.slice(0, pos + 1), [id, ...lay.slice(pos + 1)]]]) {
    const al = analyze(l), ar = analyze(r);
    if (al.valid && ar.valid) return [al.layout, ar.layout];
  }
  return null;
}

// Dropping the tile a joker stands for onto its combination swaps them: the tile takes the
// joker's place and the joker goes to a new combination of its own, ready to be completed.
function swapJoker(set, id) {
  const t = TT[id], a = analyze(set);
  if (t.j || !a.valid) return null;
  const lay = a.layout, k = lay.findIndex(i => !TT[i].j);
  for (let p = 0; p < lay.length; p++) {
    if (!TT[lay[p]].j) continue;
    if (a.kind === 'run' && (TT[lay[k]].c !== t.c || TT[lay[k]].n - k + p !== t.n)) continue;
    const b = analyze(lay.map((i, q) => q === p ? id : i));
    if (b.valid && b.kind === a.kind) return { set: b.layout, joker: lay[p] };
  }
  return null;
}
// Two tiles of the same number and colour can never share a combination.
function hasTwin(ids) {
  const seen = new Set();
  return ids.some(i => { if (TT[i].j) return false; const k = TT[i].c * 16 + TT[i].n; if (seen.has(k)) return true; seen.add(k); return false; });
}

function moveSelected(t) {
  if (!W || !sel.size) return;
  const ids = [...sel];
  const mine = new Set(G.myRack);
  if (t.type === 'rack' && ids.some(i => !mine.has(i))) { toast('Peças que já estavam na mesa não podem voltar para o suporte.', true); return; }
  let swap = null, split = null;
  if (t.type === 'set' && W.board[t.i]) {
    const target = W.board[t.i].filter(i => !sel.has(i));
    if (ids.length === 1 && target.length) {
      swap = swapJoker(target, ids[0]);
      if (!swap && !analyze([...target, ids[0]]).valid) split = splitRun(target, ids[0]);
    }
    if (!swap && !split && hasTwin([...target, ...ids])) { toast('Essa combinação já tem uma peça igual a essa.', true); sel.clear(); render(); return; }
  }
  W.board = W.board.map(s => s.filter(i => !sel.has(i)));
  W.rack = W.rack.filter(i => !sel.has(i));
  if (t.type === 'set' && W.board[t.i]) {
    const target = W.board[t.i];
    if (swap) { W.board[t.i] = swap.set; W.board.push([swap.joker]); toast('Coringa liberado: complete a nova combinação dele.'); }
    else if (split) W.board.splice(t.i, 1, ...split); else target.push(...ids);
  } else if (t.type === 'set' || t.type === 'new') W.board.push(ids);
  else { W.rack.push(...ids); if (t.slot) placeInRack(ids, t.slot.r, t.slot.c); }
  W.board = W.board.filter(s => s.length).map(s => { const a = analyze(s); return a.valid ? a.layout : s; });
  sel.clear(); render(); pushLive();
}
const parseDrop = d => {
  if (d === 'new') return { type: 'new' };
  if (d.startsWith('rack')) { const p = d.split(':'); return p.length === 3 ? { type: 'rack', slot: { r: +p[1], c: +p[2] } } : { type: 'rack' }; }
  return { type: 'set', i: +d.split(':')[1] };
};

function finishTurn() {
  const err = validateMove(G.board, G.myRack, !!G.melded[me.id], W.board);

    } else info += `<span>Vez de <b>${esc(nameOf(cur))}</b></span>`;
    info += `<span class="clock ${clock.low ? 'low' : ''}" id="timer" title="${G.turnLimit ? 'Tempo restante' : 'Tempo desta jogada'}">${clock.text}</span>`;
    if (st.canSkip) info += `<button class="btn small warn" data-act="skip">${st.confirmSkip ? 'Confirmar: pular' : 'Pular ausente'}</button>`;
  }
  if (st.offline) info += '<span class="warnmsg">Sem conexão, reconectando…</span>';
  else if (st.hostAway) info += '<span class="warnmsg">Anfitrião desconectado</span>';
  info += `<span class="log" title="${esc(G.log.join('\n'))}">${esc(G.log[G.log.length - 1] || '')}</span>`;

  let sets = board.map((s, i) => {
    const a = W ? analyze(s) : null;
    return `<div class="set ${a ? (a.valid ? 'ok' : 'bad') : ''}" data-drop="set:${i}">${s.map(id => tileHTML(id, true, !!live && !onTable.has(id))).join('')}</div>`;
  }).join('');
  if (W) sets += `<div class="newset" data-drop="new">Solte aqui para nova combinação</div>`;
  if (!board.length && !W) sets = `<p class="empty">A mesa está vazia. A primeira descida precisa somar 30 pontos.</p>`;

  let rack;
  if (player) {
    const grid = rackGrid(rackIds());
    let cells = '';
    for (let r = 0; r < 2; r++) for (let c = 0; c < rackCols; c++) {
      const id = grid.get(slotKey(r, c));
      cells += `<div class="rslot" data-drop="rack:${r}:${c}">${id !== undefined ? tileHTML(id, false) : ''}</div>`;
    }
    rack = `<div class="rackwrap"><div class="rack ${W ? 'live' : ''}" style="--cols:${rackCols}" aria-label="Seu suporte">${cells}</div></div>`;
  } else rack = `<div class="rackwrap"><p class="muted watch">Você está assistindo a partida.</p></div>`;

  const playedCount = W ? W.board.flat().filter(i => G.myRack.includes(i)).length : 0;
  const leaveLabel = isHost && !G.solo ? (st.confirmClose ? 'Confirmar' : 'Encerrar') : 'Sair';
  const side = `<nav class="side" aria-label="Ações">
    <div class="sidetop">
      <button class="sbtn exit ${st.confirmClose ? 'warn' : ''}" data-act="leave" title="${isHost && !G.solo ? 'Encerrar a sala' : 'Sair da sala'}" aria-label="${isHost && !G.solo ? 'Encerrar a sala' : 'Sair da sala'}">${ICON_EXIT}${st.confirmClose ? `<span>${leaveLabel}</span>` : ''}</button>
      ${voiceButtons()}
    </div>
    <div class="sidemid">
      <button class="sbtn sort" data-act="sort-run" title="Organizar por cor e sequência" ${player ? '' : 'disabled'}>789</button>
      <button class="sbtn sort" data-act="sort-group" title="Organizar por número" ${player ? '' : 'disabled'}>777</button>
    </div>
    <div class="sidebot">
      <button class="sbtn undo" data-act="undo" title="Desfazer as mudanças desta jogada" aria-label="Desfazer" ${mineTurn ? '' : 'disabled'}>${ICON_UNDO}</button>
      <button class="sbtn ok" data-act="finish" title="Finalizar jogada" ${mineTurn && playedCount ? '' : 'disabled'}>${ICON_CHECK}<span>Finalizar</span></button>
      <button class="sbtn draw" data-act="draw" title="${G.poolCount ? 'Comprar uma peça e passar a vez' : 'Passar a vez'}" ${mineTurn ? '' : 'disabled'}><span class="plus">${G.poolCount ? '+' : '&raquo;'}</span><span class="cnt">${TILE_ICON}${G.poolCount}</span></button>
    </div>
  </nav>`;

  let modal = '';
  if (G.status === 'ended' && G.result) {
    const r = G.result;
    const total = G.order.filter(id => id !== r.winner).reduce((a, id) => a + r.sums[id], 0);
    const ranked = [...G.order].sort((a, b) => (a === r.winner ? -1 : b === r.winner ? 1 : r.sums[a] - r.sums[b]));
    modal = `<div class="modal"><div class="card">
      <span class="label">${r.reason === 'out' ? 'Bateu!' : 'Monte esgotado'}</span>
      <h2>${esc(nameOf(r.winner))} venceu</h2>
      <ul class="results">${ranked.map(id => `<li class="${id === r.winner ? 'win' : ''}"><span class="n">${esc(nameOf(id))}${id === me.id ? ' (você)' : ''}</span><span>${id === r.winner ? '+' + total : '−' + r.sums[id]}</span></li>`).join('')}</ul>
      <p class="muted">Os pontos são a soma das peças que sobraram no suporte (coringa vale 30).</p>
      <div class="row">${isHost ? '<button class="btn primary" data-act="again">Jogar de novo</button>' : '<span class="muted grow">O anfitrião pode começar outra partida.</span>'}<button class="btn" data-act="leave">${isHost && !G.solo ? 'Encerrar sala' : 'Sair da sala'}</button></div>
    </div></div>`;
  }

  return `<div class="game">
    <aside class="players"><ul>${players}</ul></aside>
    <div class="info">${info}</div>
    <main class="board ${W ? 'live' : ''}" ${W ? 'data-drop="new"' : ''}>${sets}</main>
    ${rack}
    ${side}
  </div>${modal}`;
}

let toastTimer = null;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 5200 : 2800);
}
function noAccess(msg) { st.screen = 'noaccess'; st.msg = msg; render(); }

/* ---------- Events ---------- */
function genCode() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += L[rnd(L.length)]; return s; }
let soloPrefs = { count: 1, level: 'medium', limit: 0 };
try { soloPrefs = { ...soloPrefs, ...JSON.parse(localStorage.getItem('rummi.solo') || '{}') }; } catch (e) {}

function startSolo() {
  hosting = true; code = 'SOLO'; ls('rummi.code', code);
  S = { code, host: me.id, status: 'lobby', solo: true, turnLimit: soloPrefs.limit, players: [{ pid: me.id, name: nick }], rev: 1 };
  for (let n = 1; n <= soloPrefs.count; n++) S.players.push({ pid: 'bot' + n, name: `Robô ${n} (${BOT_LEVELS[soloPrefs.level]})`, bot: soloPrefs.level });
  hostStart();
}

function readNick() {
  const v = ($('#nick') ? $('#nick').value : nick).trim().slice(0, 20);
  if (!v) { toast('Escreva seu nome antes de entrar.', true); return null; }
  nick = v; ls('rummi.nick', v); return v;
}

function act(name, el) {
  switch (name) {
    case 'create': if (readNick()) hostRoom(genCode(), null); return;
    case 'solo': {
      if (!readNick()) return;
      soloPrefs.count = Math.min(7, Math.max(1, +$('#botcount').value || 1));
      soloPrefs.level = BOT_LEVELS[$('#botlevel').value] ? $('#botlevel').value : 'medium';
      soloPrefs.limit = +$('#sololimit').value || 0;
      try { localStorage.setItem('rummi.solo', JSON.stringify(soloPrefs)); } catch (e) {}
      startSolo(); return;
    }
    case 'callyes': answerCall(true); return;
    case 'callno': answerCall(false); return;
    case 'phone': voice.inCall ? leaveCall() : joinCall(); return;
    case 'limit': send({ t: 'limit', v: +el.dataset.v }); return;
    case 'addbot': soloPrefs.level = $('#addlevel').value; send({ t: 'addbot', level: soloPrefs.level }); return;
    case 'join': {
      if (!readNick()) return;
      const c = ($('#joincode').value || '').toUpperCase().replace(/[^A-Z]/g, '');
      if (c.length !== 4) { toast('O código da sala tem 4 letras.', true); return; }
      ls('rummi.code', c); joinRoom(c); return;
    }
    case 'cancel': closeLocal(); return;
    case 'joinlobby': send({ t: 'hello', name: nick, epk: ecdhPub }); return;
    case 'leave':
      if (hosting && S && S.solo) { closeLocal(); return; }
      if (hosting && !st.confirmClose) { st.confirmClose = true; render(); setTimeout(() => { st.confirmClose = false; render(); }, 4000); return; }
      st.confirmClose = false; leaveRoom(); return;
    case 'kick': send({ t: 'kick', pid: el.dataset.id }); return;
    case 'start': send({ t: 'start' }); return;
    case 'again': send({ t: 'again' }); return;
    case 'sort-run': sortRack('run'); return;
    case 'sort-group': sortRack('group'); return;
    case 'undo': W = { rev: G.rev, board: G.board.map(s => [...s]), rack: [...G.myRack] }; sel.clear(); render(); pushLive(); return;
    case 'draw': send({ t: 'draw', rev: G.rev }); return;
    case 'finish': finishTurn(); return;
    case 'skip':
      if (!st.confirmSkip) { st.confirmSkip = true; render(); return; }
      st.confirmSkip = false; send({ t: 'skip', rev: G.rev }); return;
  }
}

let suppressClick = false, press = null;
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  const a = e.target.closest('[data-act]');
  if (a) { if (!a.disabled) act(a.dataset.act, a); return; }
  const tile = e.target.closest('[data-tile]');
  if (tile && W) {
    const id = +tile.dataset.tile;
    const group = press && press.id === id && press.group;
    if (group) { const all = group.every(i => sel.has(i)); group.forEach(i => all ? sel.delete(i) : sel.add(i)); }
    else sel.has(id) ? sel.delete(id) : sel.add(id);
    render(); return;
  }
  const drop = e.target.closest('[data-drop]');
  if (drop && W && sel.size) moveSelected(parseDrop(drop.dataset.drop));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'joincode') act('join');
  if (e.key === 'Escape' && sel.size) { sel.clear(); render(); }
});

/* Dragging tiles with finger or mouse. A tap selects; dragging a selected tile carries every
   selected tile; grabbing the first tile of a combination in the rack carries the combination.
   Outside your turn you can still rearrange your rack. */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (e.button > 0 || drag) return;
  const t = e.target.closest('[data-tile]');
  if (!t || !t.closest('.board, .rack')) { press = null; return; }
  const inRack = !!t.closest('.rack');
  if (!W && !(inRack && isPlayer())) return;
  const id = +t.dataset.tile;
  press = { id, group: inRack ? autoGroup(id) : null };
  drag = { id, pid: e.pointerId, x0: e.clientX, y0: e.clientY, started: false, inRack, group: press.group };
});
function dropAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const d = el.closest('[data-drop]');
  if (!d || (!W && !d.dataset.drop.startsWith('rack'))) return null;
  return d;
}
// A tile grabbed in the rack moves alone while it stays over the rack, so it can go anywhere;
// carried up to the table it brings its whole combination. Tiles you selected always travel together.
function startDrag() {
  const picked = W && sel.has(drag.id);
  drag.full = picked ? [...sel] : W ? drag.group || [drag.id] : [drag.id];
  drag.solo = picked || !drag.inRack ? drag.full : [drag.id];
  const g = document.createElement('div');
  g.className = 'ghost';
  g.style.setProperty('--tw', (parseFloat(getComputedStyle($('.rack') || $('.board')).getPropertyValue('--tw')) || 34) + 'px');
  $('#stage').appendChild(g);
  drag.ghost = g;
  setDragIds(drag.inRack ? drag.solo : drag.full);
  document.body.classList.add('dragging');
  drag.started = true;
}
function setDragIds(ids) {
  if (drag.ids === ids) return;
  drag.ids = ids;
  drag.ghost.innerHTML = ids.map(id => tileHTML(id, false)).join('');
  document.querySelectorAll('.lifting').forEach(x => x.classList.remove('lifting'));
  ids.forEach(id => document.querySelectorAll(`[data-tile="${id}"]`).forEach(x => x.classList.add('lifting')));
}
function endDragVisuals() {
  if (drag && drag.ghost) drag.ghost.remove();
  document.body.classList.remove('dragging');
  document.querySelectorAll('.drophover').forEach(x => x.classList.remove('drophover'));
  document.querySelectorAll('.lifting').forEach(x => x.classList.remove('lifting'));
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    startDrag();
  }
  e.preventDefault();
  const p = toStage(e.clientX, e.clientY);
  drag.ghost.style.transform = `translate(${p.x - 16}px, ${p.y - 36}px)`;
  const hit = dropAt(e.clientX, e.clientY);
  document.querySelectorAll('.drophover').forEach(x => x !== hit && x.classList.remove('drophover'));
  if (hit) { hit.classList.add('drophover'); setDragIds(hit.dataset.drop.startsWith('rack') ? drag.solo : drag.full); }
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  if (!d.started) { drag = null; return; }
  const hit = dropAt(e.clientX, e.clientY);
  endDragVisuals(); drag = null;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
  if (!hit) { render(); return; }
  const t = parseDrop(hit.dataset.drop);
  const ids = t.type === 'rack' ? d.solo : d.full;
  const fromRack = ids.every(i => rackIds().includes(i));
  if (t.type === 'rack' && fromRack) {
    if (t.slot) placeInRack(ids, t.slot.r, t.slot.c);
    sel.clear(); render();
  } else if (W) { sel = new Set(ids); moveSelected(t); }
  else render();
});
document.addEventListener('pointercancel', () => { if (drag) { endDragVisuals(); drag = null; render(); } });

setInterval(() => {
  if (!G || G.status !== 'playing' || st.screen !== 'game') return;
  const c = clockText();
  const el = document.getElementById('timer');
  if (el) { el.textContent = c.text; el.classList.toggle('low', c.low); }
  const av = document.getElementById('turnav');
  if (av) { av.style.setProperty('--p', c.frac); av.classList.toggle('low', c.low); }
  const avt = document.getElementById('turnavt');
  if (avt && G.turnLimit) avt.textContent = c.left;
  // Time is up: if the table is valid, the move is finished for you.
  if (myTurn() && W && G.turnLimit && st.autoSent !== G.rev && c.left <= 1) {
    st.autoSent = G.rev;
    const played = W.board.flat().some(i => G.myRack.includes(i));
    if (played && !validateMove(G.board, G.myRack, !!G.melded[me.id], W.board)) {
      send({ t: 'commit', rev: G.rev, board: W.board });
      toast('Tempo esgotado: sua jogada estava certa e foi finalizada.');
    }
  }
  const el2 = Math.floor((Date.now() + clockOff - (G.turnStartedAt || Date.now())) / 1000);
  const canSkip = !G.turnLimit && !G.solo && el2 >= 90 && !myTurn() && isPlayer() && !isBot(G.order[G.turn]);
  if (canSkip !== st.canSkip) { st.canSkip = canSkip; render(); }
}, 1000);
/* ---------- Boot ---------- */
async function boot() {
  if (!NT) return noAccess('Não foi possível carregar o módulo de conexão. Verifique a internet e recarregue a página.');
  if (!window.crypto || !crypto.subtle) return noAccess('Abra o jogo por um endereço https:// (ou como arquivo no computador) para que a conexão segura funcione.');
  const savedSk = ls('rummi.sk');
  sk = savedSk ? unhex(savedSk) : NT.generateSecretKey();
  if (!savedSk) ls('rummi.sk', hex(sk));
  me.id = NT.getPublicKey(sk);
  try { await initEcdh(); } catch (e) { return noAccess('Este navegador não suporta a criptografia do jogo. Use Chrome, Edge, Firefox ou Safari atualizados.'); }
  nick = ls('rummi.nick') || '';
  let savedHost = null;
  try { savedHost = JSON.parse(ls('rummi.host') || 'null'); } catch (e) {}
  const savedCode = ls('rummi.code');
  if (savedHost && savedHost.code && savedHost.host === me.id) return hostRoom(savedHost.code, savedHost);
  if (savedCode && nick) return joinRoom(savedCode);
  st.screen = 'home'; render();
}
boot();
})();
</script>
</body>
</html>
